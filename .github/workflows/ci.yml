# Checks every push and pull request: formatting, clippy (pedantic, as the
# workspace's lints ask) and the tests.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # crates.io has been unreachable for a minute at a time on the
  # runners; cargo's default three tries gave up and failed a release.
  CARGO_NET_RETRY: 10
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  RUST_VERSION: "1.96.0"

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt
          rustup default "$RUST_VERSION"
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-24.04
    env:
      # The web app is built into the program here, as releases build it:
      # a build that can't fails, rather than leaving it out.
      CLACKATOO_WEB_APP: required
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy \
            --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          # The version of the wasm-bindgen crate in Cargo.lock, exactly.
          tool: wasm-bindgen@0.2.129
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: clippy
          # Only main's caches are kept, so branches can't fill them.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # With the lifecycle tests, which are left out without their feature.
      - run: cargo clippy --workspace --all-targets --features clackatoo/lifecycle --locked -- -D warnings
      # The web app as it's built, for the browser.
      - run: cargo clippy -p clackatoo-web --target wasm32-unknown-unknown --locked -- -D warnings

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: Install a software GPU and the shells the tests use
        # Lavapipe, Mesa's Vulkan on the CPU, for the window's tests that
        # draw; without a GPU they skip themselves. zsh and fish for the
        # shell integration's tests.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers zsh fish
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest@0.9.148
      # Not `--all-targets`: that would build the daemon's fake language
      # server as a test harness too.
      - run: cargo nextest run --workspace --locked --profile ci
      - run: cargo test --workspace --locked --doc

  lifecycle:
    # The daemon under a real systemd, stopped with its scope, upgraded and
    # killed (crates/clackatoo/tests/lifecycle.rs). The runner's user has
    # no systemd user manager running, so logind is asked to keep one, as
    # it does for a user who lingers, and the tests make their scopes in
    # it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: lifecycle
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Keep a systemd user manager
        run: |
          sudo loginctl enable-linger "$(id -un)"
          runtime="/run/user/$(id -u)"
          for _ in $(seq 100); do
            [ -S "$runtime/bus" ] && break
            sleep 0.1
          done
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$runtime/bus" >> "$GITHUB_ENV"
      - name: Check it makes scopes
        run: systemd-run --user --scope --quiet --collect true
      # The fake agent the tests' chats talk to.
      - run: cargo build -p clackatoo-daemon --examples --locked
      - run: cargo test -p clackatoo --features lifecycle --test lifecycle --locked

  keystrokes:
    # The keystroke gate's measurements (crates/bench/src/e2e/gate.rs), on
    # each push to main, for the record only: a runner's machine differs
    # from one run to the next, so they're never checked against the
    # baseline, which is measured on one machine. `scripts/release` checks
    # it there.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: Install a software GPU, to build frames on
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: keystrokes
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo bench --profile quick --locked -p clackatoo --bench e2e -- gate

  fuzz:
    # The fuzz targets (fuzz/, a workspace of their own) still build
    # against the crates' insides: checked only, never run here. The
    # nightly cargo-fuzz runs them on, pinned like the stable toolchain.
    runs-on: ubuntu-24.04
    env:
      NIGHTLY: nightly-2026-08-30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$NIGHTLY" --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: fuzz
          workspaces: fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo +"$NIGHTLY" check --manifest-path fuzz/Cargo.toml --locked --bins

  licences:
    # Every crate built in must be under a licence .config/about.toml
    # accepts, or the release fails; this says so before a tag does.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-about@0.9.2
      - run: cargo about generate --locked -c .config/about.toml .config/about.hbs -o /dev/null
