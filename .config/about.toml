# What cargo-about lists in THIRD-PARTY-LICENSES, which each release ships
# beside its builds: the licences of every crate built into clackatoo.
#
#   cargo about generate -c .config/about.toml .config/about.hbs -o THIRD-PARTY-LICENSES
#
# A dependency under a licence not accepted here fails the release, so a
# new one is looked at before it ships.

accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    # webpki-roots: Mozilla's root certificates, as data.
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

# Only what's built into the program, for the machines releases are for.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# clackatoo's own crates.
private = { ignore = true }
