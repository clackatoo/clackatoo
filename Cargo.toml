[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "2026.10.16"
edition = "2024"
rust-version = "1.96"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/clackatoo/clackatoo"

[workspace.dependencies]
clackatoo-term = { path = "crates/term" }
clackatoo-text = { path = "crates/text" }
clackatoo-syntax = { path = "crates/syntax" }
clackatoo-protocol = { path = "crates/protocol" }
clackatoo-daemon = { path = "crates/daemon" }
clackatoo-bench = { path = "crates/bench" }
clackatoo-gui = { path = "crates/gui" }
clackatoo-update = { path = "crates/update" }
clackatoo-netem = { path = "crates/netem" }

# The types of ACP, the Agent Client Protocol, which chats with agents
# speak. Only the types: the daemon frames the messages itself,
# in its own event loop. Without schemars, which only describes them.
agent-client-protocol-schema = { version = "1.10", default-features = false }
anyhow = "1.0"
# Checks the web app's password against its hash, kept as Argon2id (the
# RustCrypto implementation, pure Rust). Without its own random numbers:
# the salt comes from ring.
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
# Text only: images would pull in an image codec.
arboard = { version = "3.6", default-features = false }
# Decodes and encodes the clipboard text programs send with OSC 52. The
# version the ACP types already build.
base64 = "0.23"
bitflags = "2.13"
# The buffers quinn-proto takes packets in.
bytes = "1.10"
bytemuck = { version = "1.25", features = ["derive"] }
clap = { version = "4.6", default-features = false, features = ["std", "derive", "env", "help", "usage", "error-context", "suggestions"] }
# Timestamps on every line (humantime), so logs from two machines can be
# laid side by side.
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
# Unpacks the releases `clackatoo update` downloads, which are gzipped to
# about a third of their size. Pure Rust (miniz_oxide).
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
# Loads fontconfig only when the window first needs a font, so CLI commands
# and the daemon don't pay for linking it and its dependencies.
fontique = { version = "0.11", features = ["fontconfig-dlopen"] }
# Matches the files language servers ask to hear of changes to, by the
# glob patterns LSP gives. Already built, for `ignore`.
globset = { version = "0.4.20", default-features = false }
# Walks a project for the finder as ripgrep does (it's ripgrep's walker),
# leaving out ignored and hidden files, on several threads.
ignore = "0.4.33"
# Compares a buffer with its file's text in git, line by line, for the
# signs beside its lines: the histogram algorithm, as Helix uses it, and
# fast enough to run after every pause in typing on a big file.
imara-diff = { version = "0.2.0", default-features = false }
# Reads the web app's HTTP requests: hyper's parser, with no dependencies
# and no I/O of its own, so the daemon's event loop drives it, and strict
# about what it takes.
httparse = "1.10"
# Says when a chat's turns were sent, in the local time zone, which it
# reads from TZ and /etc/localtime as the C library does. Already built,
# for env_logger's timestamps; no copy of the time zone database.
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
# pidfd_send_signal with a flag rustix has no way to pass: signalling a
# child's whole process group through its pidfd.
libc = "0.2"
log = "0.4"
# Finds line ends in files grepped.
memchr = "2.8"
# Checks the signature on a release before `clackatoo update` installs it.
# By minisign's author, with no dependencies of its own.
minisign-verify = "0.3"
# The finder's fuzzy matching and ranking in the window: Helix's, scoring
# as fzf does, and fast enough to rank a big project's files as you type.
nucleo-matcher = "0.3.1"
# Lays out a chat's text: line breaking, mixed styles, and the box a
# message is typed in. Built on fontique, as our own fonts are, so there's
# one collection of them.
parley = { version = "0.11", default-features = false, features = ["std"] }
mio = { version = "1.2", features = ["os-poll", "os-ext", "net"] }
pollster = "1.0"
# The QUIC engine with no networking of its own, driven from our own event
# loops. ring rather than aws-lc-rs, which needs cmake to build.
quinn-proto = { version = "0.11", default-features = false, features = ["rustls-ring", "log"] }
# A self-signed certificate for each daemon's QUIC endpoint.
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
# The finder's grep, over a whole file at a time, as ripgrep's engine, and
# editors' patterns, for `/`, `:s` and `:g`, translated from Vim's.
regex = { version = "1.13", default-features = false, features = ["std", "perf", "unicode"] }
# Reads the agent's words in a chat as Markdown.
pulldown-cmark = { version = "0.13", default-features = false }
mlua = { version = "0.12.2", features = ["luau"] }
similar = { version = "2.7", default-features = false, features = ["text"] }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
# Checks the files of language packs downloaded (SHA-256). Already built
# for rustls.
ring = "0.17"
# TLS for QUIC: the same version and backend as quinn-proto's.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustix = { version = "1.1", features = ["fs", "net", "pipe", "process", "pty", "std", "stdio", "termios"] }
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_json = "1.0"
simdutf8 = "0.1"
slab = "0.4"
swash = "0.2"
thiserror = "2.0"
# The text of files being edited: a tree of chunks, so an edit in the middle
# of a big file is cheap. Lines end at \n only, as Vim's do.
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
# Parses buffers, with grammars loaded at runtime as WebAssembly and run by
# wasmtime, so a new language never needs a new clackatoo.
tree-sitter = { version = "=0.27.0", features = ["wasm"] }
# Edits keep a config file's comments and layout.
toml_edit = "0.25"
unicode-segmentation = "1.13"
# Fetches releases for `clackatoo update` over HTTPS: small and blocking,
# with rustls and ring, which QUIC already builds, and Mozilla's roots.
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
unicode-width = "0.2"
vte = { version = "0.15", default-features = false, features = ["std"] }
wgpu = "30"
winit = "0.30"
# Decodes the pictures of chats' pages a browser pane shows, which
# Chromium sends as JPEGs. Pure Rust, and fast; zune-core is its options.
zune-core = "0.5"
zune-jpeg = "0.5.15"

alacritty_terminal = { version = "0.26", default-features = false }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
insta = "1.49"
# Signs fake releases in the update tests, as CI's minisign signs real ones.
minisign = "0.10"
png = "0.18"
proptest = "1.11"
tempfile = "3.27"
# A WebSocket client for the web app's tests, so the daemon's own framing
# is tested against someone else's.
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }

[workspace.lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile.release]
# Whole-program optimisation: lets the compiler inline across crates (vte's
# parameter iterator, for one, is otherwise a call per parameter). Slower
# release builds, for a faster and smaller binary.
lto = "fat"
codegen-units = 1

# swash's shaper takes away 1 with wrapping arithmetic when a font replaces
# a glyph with none, as Noto Color Emoji does for two regional indicators
# that aren't a flag (🇽🇬). That's what it means, and release builds do
# it; with overflow checks, debug builds and tests panic instead.
[profile.dev.package.swash]
overflow-checks = false

# Argon2 is slow by design, and far slower unoptimised: debug builds and
# tests check the web app's password in milliseconds, not seconds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

# The web app, compiled to WebAssembly for an optimised program (see
# crates/clackatoo/build/web_app.rs): small, as a phone fetches it.
[profile.web]
inherits = "release"
opt-level = "z"
panic = "abort"
lto = true
codegen-units = 1

# The web app for the rest: quicker to build.
[profile.web-dev]
inherits = "dev"
opt-level = "s"
debug = false
panic = "abort"

# An optimised build without whole-program optimisation, for trying things
# out: much faster to build than release, a little slower to run.
# `cargo build --profile quick`
[profile.quick]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
