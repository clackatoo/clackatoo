[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.dependencies]
clackatoo-term = { path = "crates/term" }
clackatoo-protocol = { path = "crates/protocol" }
clackatoo-daemon = { path = "crates/daemon" }
clackatoo-bench = { path = "crates/bench" }

anyhow = "1.0"
bitflags = "2.13"
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
env_logger = { version = "0.11", default-features = false }
log = "0.4"
mio = { version = "1.2", features = ["os-poll", "os-ext", "net"] }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
rustix = { version = "1.1", features = ["fs", "process", "pty", "std", "termios"] }
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
slab = "0.4"
thiserror = "2.0"
unicode-width = "0.2"
vte = { version = "0.15", default-features = false, features = ["std"] }

alacritty_terminal = { version = "0.26", default-features = false }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
insta = "1.49"
proptest = "1.11"
tempfile = "3.27"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile.release]
# Whole-program optimisation: lets the compiler inline across crates (vte's
# parameter iterator, for one, is otherwise a call per parameter). Slower
# release builds, for a faster and smaller binary.
lto = "fat"
codegen-units = 1
