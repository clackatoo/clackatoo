[package]
name = "clackatoo-term"
description = "Terminal emulation core: escape-sequence dispatch onto clackatoo's own grid. Performs no I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# No #[bench] functions live here. Without this, `cargo bench -- OPTIONS`
# would hand criterion's options to libtest, which rejects them.
bench = false

[dependencies]
base64.workspace = true
bitflags.workspace = true
log.workspace = true
serde = { workspace = true, optional = true }
simdutf8.workspace = true
thiserror.workspace = true
unicode-width.workspace = true
# The parser's test oracle, for the fuzzer too (see `fuzzing`).
vte = { workspace = true, optional = true }

[features]
## Serialize and deserialize the public value types (Size, Style and its
## parts), for the wire protocol.
serde = ["dep:serde", "bitflags/serde"]
## Entry points for the fuzzer in `fuzz/`, which reach what the crate keeps
## to itself. Never for the product.
fuzzing = ["dep:vte"]

[dev-dependencies]
# The parser's test oracle: see src/parser/tests.rs.
vte.workspace = true
insta.workspace = true
proptest.workspace = true

[lints]
workspace = true
