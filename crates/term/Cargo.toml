[package]
name = "clackatoo-term"
description = "Terminal emulation core: escape-sequence dispatch onto clackatoo's own grid. Performs no I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bitflags.workspace = true
log.workspace = true
serde = { workspace = true, optional = true }
thiserror.workspace = true
unicode-width.workspace = true
vte.workspace = true

[features]
## Serialize and deserialize the public value types (Size, Style and its
## parts), for the wire protocol.
serde = ["dep:serde", "bitflags/serde"]

[dev-dependencies]
insta.workspace = true
proptest.workspace = true

[lints]
workspace = true
