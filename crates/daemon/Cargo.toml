[package]
name = "clackatoo-daemon"
description = "The clackatoo daemon, which owns every terminal, and the client that talks to it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# See crates/term/Cargo.toml: keeps `cargo bench -- OPTIONS` working.
bench = false

[dependencies]
agent-client-protocol-schema.workspace = true
bytes.workspace = true
clackatoo-protocol.workspace = true
clackatoo-term = { workspace = true, features = ["serde"] }
clackatoo-text.workspace = true
log.workspace = true
mio.workspace = true
postcard.workspace = true
quinn-proto.workspace = true
rcgen.workspace = true
rustls.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
slab.workspace = true
thiserror.workspace = true
unicode-width.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
