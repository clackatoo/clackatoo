[package]
name = "clackatoo"
description = "A fast, lightweight terminal workspace."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "clackatoo"
# See crates/term/Cargo.toml: keeps `cargo bench -- OPTIONS` working.
bench = false

[dependencies]
anyhow.workspace = true
clackatoo-daemon.workspace = true
clackatoo-gui.workspace = true
clackatoo-protocol.workspace = true
clackatoo-syntax.workspace = true
clackatoo-term.workspace = true
clackatoo-update.workspace = true
clap.workspace = true
env_logger.workspace = true
log.workspace = true
toml_edit.workspace = true

[dev-dependencies]
clackatoo-bench.workspace = true
clackatoo-update = { workspace = true, features = ["fake"] }
tempfile.workspace = true

[[bench]]
name = "e2e"
harness = false

[lints]
workspace = true
