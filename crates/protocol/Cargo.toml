[package]
name = "clackatoo-protocol"
description = "Messages between clackatoo clients and the daemon, and their framing. Performs no I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# See crates/term/Cargo.toml: keeps `cargo bench -- OPTIONS` working.
bench = false

[dependencies]
clackatoo-term = { workspace = true, features = ["serde"] }
clackatoo-text = { workspace = true, features = ["serde"] }
postcard.workspace = true
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
